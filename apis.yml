aid: kudos
name: Kudos
description: 'Kudos is a consumer credit-card rewards and smart-shopping assistant operated
  by Kudos Technologies, Inc., founded in 2021 by Tikue Anazodo and Ahmad Ismail. Its browser
  extension and iOS/Android apps sit at online checkout and recommend which of a shopper''s
  connected cards to use to maximize points, cash back, and card benefits. Kudos Boost pays
  cashback at 15,000+ stores, redeemable as Amazon gift cards or PayPal cash, and the product
  bundles free credit-score access, a wallet and credit-management hub, a best-card cheatsheet,
  weekly insights scores, a Dream Wallet planner, and an Explore card-comparison and Test Drive
  tool. Kudos is backed by QED Investors. As of July 2026 Kudos publishes no public developer
  API, developer portal, OpenAPI specification, or SDKs; its only machine-readable public
  surface is mobile app-association metadata at app.joinkudos.com.'
